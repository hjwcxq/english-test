<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>背词助教 · Pad</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <h1>背词助教 · 学生 Pad</h1>
    <div>
      <button class="secondary" id="fullscreen" aria-pressed="false">全屏</button>
      <button class="secondary" id="exit">退出登录</button>
    </div>
  </header>
  <main id="pad-shell" class="pad-shell">
    <span class="pill">演示空间</span>
    <h2>今日黄金任务</h2>
    <p class="muted">本页是 W4 可操作骨架；请使用横屏触控 Pad 访问，正式学习流程尚未建设完成，相关入口会如实显示“待建设”。</p>

    <section class="card">
      <h3>标准 Unicode IPA 显示样例</h3>
      <div class="ipa-samples">
        <span class="ipd">phenomenon /fəˈnɒmɪnən/</span>
        <span class="ipd">comprehension /ˌkɒmprɪˈhenʃn/</span>
        <span class="ipd">accommodate /əˈkɒmədeɪt/</span>
      </div>
    </section>

    <section class="card" style="margin-top:18px">
      <h3>演示</h3>
      <p class="muted">选择一名演示学生进入独立演示会话，不读取真实身份、学情、音频或管理数据。</p>
      <div class="demo-list" id="demo-list"></div>
      <p class="status" id="status" role="status"></p>
    </section>

    <section class="grid" style="margin-top:18px">
      <article class="card">
        <h3>看板</h3>
        <p class="muted">待建设：真实任务队列、到期复习与抢救流程。</p>
      </article>
      <article class="card">
        <h3>作答</h3>
        <p class="muted">待建设：真实语音、拼写与语境题。</p>
      </article>
      <article class="card">
        <h3>战报</h3>
        <p class="muted">待建设：本轮结果与记忆变化。</p>
      </article>
    </section>
  </main>
  <script>
    const statusNode = document.getElementById('status');
    const fullscreenButton = document.getElementById('fullscreen');
    const exitButton = document.getElementById('exit');
    let csrf = '';
    let current = null;
    let fullscreenBusy = false;
    let logoutBusy = false;

    function setStatus(text) {
      statusNode.textContent = text;
    }

    function renderIdentity(data) {
      current = data;
      csrf = data && data.csrf_token ? data.csrf_token : '';
      if (current) {
        setStatus(`当前演示身份：${current.display_name}（${current.student_id}）`);
      }
    }

    async function readMe() {
      const response = await fetch('/api/me', {credentials: 'same-origin'});
      if (!response.ok) {
        current = null;
        csrf = '';
        return;
      }
      renderIdentity(await response.json());
    }

    async function loginDemo(studentId) {
      try {
        await readMe();
        const headers = {'Content-Type': 'application/json'};
        if (csrf) {
          headers['X-CSRF-Token'] = csrf;
        }
        const response = await fetch('/api/auth/demo/login', {
          method: 'POST',
          credentials: 'same-origin',
          headers,
          body: JSON.stringify({student_id: studentId})
        });
        if (!response.ok) {
          setStatus(response.status === 403 ? '切换演示身份前需要有效会话校验' : '演示登录失败');
          return;
        }
        await readMe();
      } catch (error) {
        setStatus('网络请求失败');
      }
    }

    async function loadDemoStudents() {
      const response = await fetch('/api/demo/students', {credentials: 'same-origin'});
      const payload = await response.json();
      const container = document.getElementById('demo-list');
      container.replaceChildren();
      for (const student of payload.students) {
        const button = document.createElement('button');
        button.className = 'secondary';
        button.textContent = student.display_name;
        button.addEventListener('click', () => loginDemo(student.student_id));
        container.appendChild(button);
      }
    }

    // The whole document is the fullscreen root so both the fullscreen control
    // and the student logout control stay inside the fullscreen element tree.
    function syncFullscreenUi() {
      const active = Boolean(document.fullscreenElement);
      fullscreenButton.textContent = active ? '退出全屏' : '全屏';
      fullscreenButton.setAttribute('aria-pressed', active ? 'true' : 'false');
    }

    fullscreenButton.addEventListener('click', async () => {
      if (fullscreenBusy) {
        return;
      }
      fullscreenBusy = true;
      fullscreenButton.disabled = true;
      const entering = !document.fullscreenElement;
      try {
        if (entering) {
          if (typeof document.documentElement.requestFullscreen !== 'function') {
            setStatus('当前浏览器不支持全屏，无法进入');
            return;
          }
          await document.documentElement.requestFullscreen();
          if (!document.fullscreenElement) {
            setStatus('全屏进入未确认，请重试');
          } else {
            setStatus('已进入全屏');
          }
        } else {
          if (typeof document.exitFullscreen !== 'function') {
            setStatus('当前浏览器不支持退出全屏');
            return;
          }
          await document.exitFullscreen();
          if (document.fullscreenElement) {
            setStatus('退出全屏未确认，请重试');
          } else {
            setStatus('已退出全屏');
          }
        }
      } catch (error) {
        setStatus(entering ? '进入全屏失败，请重试' : '退出全屏失败，请重试');
      } finally {
        fullscreenBusy = false;
        fullscreenButton.disabled = false;
        syncFullscreenUi();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      syncFullscreenUi();
      setStatus(document.fullscreenElement ? '已进入全屏' : '已退出全屏');
    });

    document.addEventListener('fullscreenerror', () => {
      syncFullscreenUi();
      setStatus('全屏操作失败，请重试');
    });

    function clearSensitiveState() {
      current = null;
      csrf = '';
      statusNode.textContent = '';
      if ('caches' in window) {
        caches.keys()
          .then((names) => Promise.all(names.map((name) => caches.delete(name))))
          .catch(() => {});
      }
    }

    async function logoutStudent() {
      if (logoutBusy) {
        return;
      }
      logoutBusy = true;
      exitButton.disabled = true;
      try {
        // Refresh the short-lived CSRF token from the real server session so a
        // retry after a failed attempt still targets the persisted session.
        try {
          const meResponse = await fetch('/api/me', {credentials: 'same-origin'});
          if (meResponse.ok) {
            const me = await meResponse.json();
            current = me;
            csrf = me.csrf_token || '';
          } else {
            current = null;
            csrf = '';
          }
        } catch (error) {
          setStatus('退出未确认，请重试');
          return;
        }
        const headers = {};
        if (csrf) {
          headers['X-CSRF-Token'] = csrf;
        }
        const response = await fetch('/api/auth/logout', {
          method: 'POST',
          credentials: 'same-origin',
          headers
        });
        if (!response.ok) {
          setStatus('退出未确认，请重试');
          return;
        }
        const payload = await response.json().catch(() => null);
        if (!payload || payload.ok !== true) {
          setStatus('退出未确认，请重试');
          return;
        }
        clearSensitiveState();
        setStatus('已退出当前学生会话');
      } catch (error) {
        setStatus('退出未确认，请重试');
      } finally {
        logoutBusy = false;
        exitButton.disabled = false;
      }
    }

    exitButton.addEventListener('click', logoutStudent);

    syncFullscreenUi();
    loadDemoStudents().then(readMe).catch(() => setStatus('演示数据加载失败'));
  </script>
</body>
</html>
